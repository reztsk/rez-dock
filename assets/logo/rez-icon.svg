<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Verre sombre -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1B1838"/>
      <stop offset="0.55" stop-color="#0E0D1E"/>
      <stop offset="1" stop-color="#07070F"/>
    </linearGradient>
    <!-- Néon signature REZ : violet → cyan → rose -->
    <linearGradient id="neon" x1="0.15" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#8B5CFF"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F472D0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#5B3DF5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5B3DF5" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="squircle">
      <rect x="64" y="64" width="896" height="896" rx="232"/>
    </clipPath>
  </defs>

  <!-- Plaque de verre -->
  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#glass)"/>
  <g clip-path="url(#squircle)">
    <circle cx="512" cy="560" r="430" fill="url(#bloom)"/>
    <path d="M64 64 H960 V420 C760 360 300 360 64 470 Z" fill="url(#sheen)"/>
  </g>
  <rect x="68" y="68" width="888" height="888" rx="228" fill="none" stroke="url(#rim)" stroke-width="8"/>

  <!-- Monogramme R : halo puis trait net -->
  <g fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 724 V300 H548 A150 150 0 0 1 548 600 H372 M520 600 L664 724" stroke-width="92" opacity="0.85" filter="url(#glow)"/>
    <path d="M372 724 V300 H548 A150 150 0 0 1 548 600 H372 M520 600 L664 724" stroke-width="76"/>
    <path d="M372 724 V300 H548 A150 150 0 0 1 548 600" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="14"/>
  </g>

  <!-- Barre "dock" lumineuse -->
  <rect x="318" y="806" width="388" height="28" rx="14" fill="url(#neon)" filter="url(#glow)" opacity="0.9"/>
  <rect x="318" y="806" width="388" height="28" rx="14" fill="url(#neon)"/>
  <circle cx="420" cy="772" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="512" cy="772" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="604" cy="772" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
