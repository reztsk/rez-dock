<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- REZ Dock — logo propre au dock (distinct de REZ Island / REZ Music) -->
  <defs>
    <!-- Verre sombre teinté sarcelle -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#103039"/>
      <stop offset="0.55" stop-color="#081820"/>
      <stop offset="1" stop-color="#03090D"/>
    </linearGradient>
    <!-- Aurore signature REZ Dock : menthe → cyan → bleu -->
    <linearGradient id="aurora" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6CF7C9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="squircle">
      <rect x="64" y="64" width="896" height="896" rx="232"/>
    </clipPath>
  </defs>

  <!-- Plaque de verre -->
  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#glass)"/>
  <g clip-path="url(#squircle)">
    <circle cx="512" cy="560" r="440" fill="url(#bloom)"/>
    <path d="M64 64 H960 V400 C760 340 300 340 64 450 Z" fill="url(#sheen)"/>
  </g>
  <rect x="68" y="68" width="888" height="888" rx="228" fill="none" stroke="url(#rim)" stroke-width="8"/>

  <g transform="translate(0 -72)">
  <!-- Étagère du dock (verre) -->
  <rect x="164" y="612" width="696" height="172" rx="86" fill="url(#shelf)" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="7"/>

  <!-- Icônes latérales -->
  <rect x="214" y="520" width="168" height="168" rx="46" fill="#163A45"/>
  <rect x="214" y="520" width="168" height="168" rx="46" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5"/>
  <rect x="642" y="520" width="168" height="168" rx="46" fill="#163A45"/>
  <rect x="642" y="520" width="168" height="168" rx="46" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5"/>

  <!-- Icône centrale agrandie (effet loupe) : halo puis tuile nette -->
  <rect x="404" y="392" width="216" height="216" rx="60" fill="url(#aurora)" filter="url(#glow)" opacity="0.9"/>
  <rect x="404" y="392" width="216" height="216" rx="60" fill="url(#aurora)"/>
  <path d="M464 392 H560 A60 60 0 0 1 620 452 V472 C560 452 470 452 404 484 V452 A60 60 0 0 1 464 392 Z" fill="#FFFFFF" fill-opacity="0.28"/>

  <!-- Point « app ouverte » -->
  <circle cx="512" cy="712" r="64" fill="url(#dotglow)"/>
  <circle cx="512" cy="712" r="18" fill="#E6FFFA"/>
  </g>
</svg>
